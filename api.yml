components:
  schemas:
    DomainSegments:
      properties:
        domain:
          type: string
          title: Domain
        segments:
          items:
            $ref: '#/components/schemas/SegmentInList'
          type: array
          title: Segments
      type: object
      required:
        - domain
        - segments
      title: DomainSegments
    EventGoalCreate:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
          default: event
        category:
          anyOf:
            - type: string
            - type: 'null'
          title: Category
          default: goal
        count_method:
          anyOf:
            - type: string
            - type: 'null'
          title: Count Method
        event_type:
          type: string
          title: Event Type
        page_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Page Url
        url_pattern:
          anyOf:
            - type: string
            - type: 'null'
          title: Url Pattern
          default: equals
        referrer:
          anyOf:
            - type: string
            - type: 'null'
          title: Referrer
        element_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Element Text
        css_selector:
          anyOf:
            - type: string
            - type: 'null'
          title: Css Selector
        time_threshold:
          anyOf:
            - type: integer
            - type: 'null'
          title: Time Threshold
        js_code:
          anyOf:
            - type: string
            - type: 'null'
          title: Js Code
        form_selector:
          anyOf:
            - type: string
            - type: 'null'
          title: Form Selector
      type: object
      required:
        - name
        - event_type
      title: EventGoalCreate
      description: DTO for creating event goals
    Goal:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
        category:
          anyOf:
            - type: string
            - type: 'null'
          title: Category
          default: goal
        site_uuid:
          type: string
          format: uuid
          title: Site Uuid
        goal_uuid:
          anyOf:
            - type: string
              format: uuid
