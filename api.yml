openapi: 3.1.0
info:
  title: Analytics Dashboard
  version: 0.1.0
paths:
  '/api/v1/sites/user/{user_id}':
    get:
      tags:
        - sites
      summary: Read Sites By User
      operationId: sites-read_sites_by_user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            description: The user ID to filter sites by
            title: User Id
          description: The user ID to filter sites by
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            description: Number of records to skip (for pagination)
            default: 0
            title: Skip
          description: Number of records to skip (for pagination)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            description: Maximum number of records to return (for pagination)
            default: 100
            title: Limit
          description: Maximum number of records to return (for pagination)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
                title: Response Sites-Read Sites By User
        '400':
          description: Invalid argument provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: INVALID_ARGUMENT
                    description: Error code identifier
                  detail:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INVALID_ARGUMENT
                        description: Error code identifier
                      message_en:
                        type: string
                        example: Invalid argument provided
                        description: Error message in English
                      message_fa:
                        type: string
                        example: پارامتر ورودی نامعتبر است.
                        description: Error message in Persian
                      http_status:
                        type: integer
                        example: 400
                        description: HTTP status code
                      argument:
                        type: string
                        example: mobile_number
                        description: Argument that was invalid
                    required:
                      - code
                      - message_en
                      - message_fa
                      - http_status
                    additionalProperties: false
                    description: Detailed error information
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: VALIDATION_ERROR
                    description: Error code identifier
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: email
                          description: Field name that failed validation
                        message:
                          type: string
                          example: Invalid email format
                          description: Validation error message
                        value:
                          type: string
                          example: invalid@email
                          description: Invalid value that caused the error
                    example:
                      - field: email
                        message: Invalid email format
                        value: invalid@email
                      - field: password
                        message: Password must be at least 8 characters
                        value: '123'
        '500':
          description: An unknown error occurred
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: UNKNOWN_ERROR
                    description: Error code identifier
                  detail:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNKNOWN_ERROR
                        description: Error code identifier
                      message_en:
                        type: string
                        example: An unknown error occurred
                        description: Error message in English
                      message_fa:
                        type: string
                        example: خطای ناشناخته‌ای رخ داده است.
                        description: Error message in Persian
                      http_status:
                        type: integer
                        example: 500
                        description: HTTP status code
                    required:
                      - code
                      - message_en
                      - message_fa
                      - http_status
                    additionalProperties: false
                    description: Detailed error information
        '503':
          description: Service is currently unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: UNAVAILABLE
                    description: Error code identifier
                  detail:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAVAILABLE
                        description: Error code identifier
                      message_en:
                        type: string
                        example: Service is currently unavailable
                        description: Error message in English
                      message_fa:
                        type: string
                        example: سرویس در حال حاضر در دسترس نیست.
                        description: Error message in Persian
                      http_status:
                        type: integer
                        example: 503
                        description: HTTP status code
                    required:
                      - code
                      - message_en
                      - message_fa
                      - http_status
                    additionalProperties: false
                    description: Detailed error information
