components:
  schemas:
    DomainSegments:
      properties:
        domain:
          type: string
          title: Domain
        segments:
          items:
            $ref: '#/components/schemas/SegmentInList'
          type: array
          title: Segments
      type: object
      required:
        - domain
        - segments
      title: DomainSegments
    Goal:
      properties:
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Name
        type:
          anyOf:
            - type: string
            - type: 'null'
          title: Type
        count_method:
          anyOf:
            - type: string
            - type: 'null'
          title: Count Method
        settings:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Settings
        site_uuid:
          type: string
          format: uuid
          title: Site Uuid
        goal_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Goal Type
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Created At
      type: object
      required:
        - site_uuid
      title: Goal
    GoalCreate:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
        count_method:
          anyOf:
            - type: string
            - type: 'null'
          title: Count Method
        settings:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Settings
        site_uuid:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Site Uuid
        page_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Page Url
        referrer:
          anyOf:
            - type: string
            - type: 'null'
          title: Referrer
        url_pattern:
          anyOf:
            - type: string
            - type: 'null'
          title: Url Pattern
      type: object
      required:
        - name
        - type
      title: GoalCreate
    GoalStats:
      properties:
        id:
          type: string
          title: Id
          description: The goal ID
        name:
          type: string
          title: Name
          description: The goal name
        type:
          type: string
          title: Type
          description: The goal type
        count:
          type: integer
          title: Count
          description: Total number of events
        total_user:
          type: integer
          title: Total User
          description: Number of unique users
        event_per_user:
          type: number
          title: Event Per User
          description: Average events per user
        utm_sources:
          anyOf:
            - items:
                $ref: '#/components/schemas/UtmSourceStats'
              type: array
            - type: 'null'
          title: Utm Sources
          description: Breakdown by UTM sources if requested
      type: object
      required:
        - id
        - name
        - type
        - count
        - total_user
        - event_per_user
      title: GoalStats
    GoalStatsRequest:
      properties:
        domain:
          type: string
          title: Domain
          description: The domain of the site
        start_date:
          anyOf:
            - type: string
            - type: 'null'
          title: Start Date
          description: Start date (YYYY-MM-DD)
        end_date:
          anyOf:
            - type: string
            - type: 'null'
          title: End Date
          description: End date (YYYY-MM-DD)
        goal_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Goal Type
          description: 'Filter by goal type (e.g., ''pageview'', ''event'')'
      type: object
      required:
        - domain
      title: GoalStatsRequest
    GoalStatsResponse:
      properties:
        domain:
          type: string
          title: Domain
        start_date:
          anyOf:
            - type: string
            - type: 'null'
          title: Start Date
        end_date:
          anyOf:
            - type: string
            - type: 'null'
          title: End Date
        goals:
          additionalProperties:
            $ref: '#/components/schemas/GoalStats'
          type: object
          title: Goals
      type: object
      required:
        - domain
        - goals
      title: GoalStatsResponse
    GoalUpdate:
      properties:
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Name
        type:
          anyOf:
            - type: string
            - type: 'null'
          title: Type
        count_method:
          anyOf:
            - type: string
            - type: 'null'
          title: Count Method
        settings:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Settings
        event_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Event Type
        page_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Page Url
        referrer:
          anyOf:
            - type: string
            - type: 'null'
          title: Referrer
        url_pattern:
          anyOf:
            - type: string
            - type: 'null'
          title: Url Pattern
        element_text:
          anyOf:
            - type: string
            - type: 'null'
          title: Element Text
        css_selector:
          anyOf:
            - type: string
            - type: 'null'
          title: Css Selector
        time_threshold:
          anyOf:
            - type: integer
            - type: 'null'
          title: Time Threshold
        js_code:
          anyOf:
            - type: string
            - type: 'null'
          title: Js Code
        form_selector:
          anyOf:
            - type: string
            - type: 'null'
          title: Form Selector
      type: object
      title: GoalUpdate
    ReferrerCategory:
      properties:
        category:
          type: string
          title: Category
          description: 'The referrer category (direct, referal, organic, social)'
        total_user:
          type: integer
          title: Total User
          description: Total number of users for this category
        new_user:
          type: integer
          title: New User
          description: Number of new users for this category
        sessions:
          type: integer
          title: Sessions
          description: Number of sessions for this category
        avg_time:
          type: number
          title: Avg Time
          description: Average time on page for this category
        sources:
          items:
            $ref: '#/components/schemas/SourceStats'
          type: array
          title: Sources
          description: Detailed source stats within this category
      type: object
      required:
        - category
        - total_user
        - new_user
        - sessions
        - avg_time
      title: ReferrerCategory
    ReferrerStatsRequest:
      properties:
        domain:
          type: string
          title: Domain
          description: The domain of the site
        start_date:
          anyOf:
            - type: string
            - type: 'null'
          title: Start Date
          description: Start date (YYYY-MM-DD)
        end_date:
          anyOf:
            - type: string
            - type: 'null'
          title: End Date
          description: End date (YYYY-MM-DD)
      type: object
      required:
        - domain
      title: ReferrerStatsRequest
    ReferrerStatsResponse:
      properties:
        domain:
          type: string
          title: Domain
          description: The domain of the site
        start_date:
          anyOf:
            - type: string
            - type: 'null'
          title: Start Date
          description: Start date (YYYY-MM-DD)
        end_date:
          anyOf:
            - type: string
            - type: 'null'
          title: End Date
          description: End date (YYYY-MM-DD)
        referrer_stats:
          items:
            $ref: '#/components/schemas/ReferrerCategory'
          type: array
          title: Referrer Stats
          description: Statistics by referrer category
      type: object
      required:
        - domain
        - referrer_stats
      title: ReferrerStatsResponse
    Segment:
      properties:
        domain:
          anyOf:
            - type: string
            - type: 'null'
          title: Domain
        name:
          type: string
          title: Name
        conditions:
          items:
            $ref: '#/components/schemas/SegmentCondition'
          type: array
          title: Conditions
